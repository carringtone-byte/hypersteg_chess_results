[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypersteg-chess"
version = "0.1.0"
description = "Offline pilot environment for the Hypersteg Chess hackathon MVP"
requires-python = ">=3.11"
dependencies = ["python-chess>=1.999,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
hypersteg = "hypersteg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
